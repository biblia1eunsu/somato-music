l": "Levi Patel As She Passes upload", "cat": "piano·Levi Patel As She Passes"}, {"id": "v9Blx4URf34", "label": "Levi Patel And She Translated (official)", "cat": "piano·Levi Patel Translated"}, {"id": "iqkgLhRThIE", "label": "Fiona Joy Hawkins Grace (official)", "cat": "piano·Fiona Joy Grace"}, {"id": "luee_gL4F8g", "label": "Fiona Joy Hawkins Grace Deluxe", "cat": "piano·Fiona Joy Grace"}, {"id": "niCMpOkMcWU", "label": "Hammock I Can Almost See You (official)", "cat": "piano·Hammock"}, {"id": "96DL94T21sw", "label": "Hammock I Would Give My Breath Away", "cat": "piano·Hammock"}, {"id": "0kYc55bXJFI", "label": "Olafur Arnalds Near Light (official MV)", "cat": "piano·Olafur Near Light"}, {"id": "urRNNvODXfM", "label": "Olafur Arnalds Near Light", "cat": "piano·Olafur Near Light"}, {"id": "kSRnuWAaeH8", "label": "Goldmund Threnody (official audio)", "cat": "piano·Goldmund Threnody"}, {"id": "rBOyX5h7Zqc", "label": "Goldmund Threnody", "cat": "piano·Goldmund Threnody"}, {"id": "2P8PZbh53ec", "label": "Nils Frahm Over There It's Raining", "cat": "piano·Nils Frahm"}, {"id": "OlaTeXX3uH8", "label": "Brian Eno An Ending Ascent (official)", "cat": "bodyscan·Brian Eno"}, {"id": "hvzQQOAjuoU", "label": "Brian Eno An Ending Ascent remaster", "cat": "bodyscan·Brian Eno"}, {"id": "_8aYF9PtQjA", "label": "Stars of the Lid Requiem Pt.2 (official)", "cat": "bodyscan·Stars of the Lid"}, {"id": "-bc37fU36Vk", "label": "Stars of the Lid Requiem Pt.1 (official)", "cat": "bodyscan·Stars of the Lid"}, {"id": "83JW5ZhVSWc", "label": "Eluvium Indoor Swimming (official)", "cat": "bodyscan·Eluvium"}, {"id": "cIUnVO3tWfo", "label": "Eluvium Indoor Swimming upload", "cat": "bodyscan·Eluvium"}, {"id": "rt97c92WjRw", "label": "Steve Roach Structures from Silence (Topic)", "cat": "bodyscan·Steve Roach"}, {"id": "UWb5DIJch_k", "label": "Steve Roach Structures from Silence upload", "cat": "bodyscan·Steve Roach"}];
window.__results = [];
window.__done = false;
let player = null, idx = 0, timer = null, startAt = 0;

function rowFor(i, it){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${i+1}</td><td>${it.cat}</td><td>${it.id}</td><td>${(it.label||'').slice(0,46)}</td><td class="wait">·</td><td>0</td>`;
  document.getElementById('tb').appendChild(tr);
  return tr;
}
const rows = ITEMS.map((it,i)=>rowFor(i,it));

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player('player', {
    height:'101', width:'180', videoId: ITEMS[0].id,
    playerVars:{autoplay:0, controls:0, disablekb:1, modestbranding:1, playsinline:1, origin:location.origin},
    events:{
      onReady: ()=>{ try{player.mute();}catch(e){}; next(0); },
      onError: (e)=>{ finish(false, 'error '+e.data); },
      onStateChange: (e)=>{
        if(e.data === 1 && window.__awaiting){ /* playing */ }
      }
    }
  });
};
function loadApi(){
  const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api';
  s.onerror = ()=>{ document.getElementById('sum').textContent = 'IFrame API 로드 실패'; };
  document.head.appendChild(s);
}
function next(i){
  if(i >= ITEMS.length){ done(); return; }
  idx = i; window.__awaiting = true;
  startAt = Date.now();
  rows[i].cells[4].textContent = '재생 중…'; rows[i].cells[4].className = 'wait';
  try { player.loadVideoById({videoId: ITEMS[i].id, startSeconds: 0}); } catch(e){ finish(false,'load '+e); }
  clearInterval(timer);
  timer = setInterval(()=>{
    const ms = Date.now() - startAt;
    rows[i].cells[5].textContent = (ms/1000).toFixed(1);
    let st = -1, t = 0;
    try { st = player.getPlayerState(); t = player.getCurrentTime(); } catch(e){}
    if(st === 1 && t > 0.5) finish(true, 'playing '+t.toFixed(1)+'s');
    else if(ms > 9000) finish(false, 'timeout state='+st);
  }, 220);
}
function finish(ok, note){
  clearInterval(timer); window.__awaiting = false;
  const secs = (Date.now() - startAt)/1000;
  const it = ITEMS[idx];
  if (rows[idx].cells[4].textContent.startsWith('OK') || rows[idx].cells[4].textContent.startsWith('FAIL')) return;
  rows[idx].cells[4].textContent = (ok?'OK':'FAIL')+' · '+note;
  rows[idx].cells[4].className = ok ? 'ok' : 'bad';
  rows[idx].cells[5].textContent = secs.toFixed(1);
  window.__results.push({id: it.id, cat: it.cat, label: it.label, ok, note, secs:+secs.toFixed(1)});
  const okc = window.__results.filter(r=>r.ok).length;
  document.getElementById('sum').textContent = `${window.__results.length}/${ITEMS.length} 검사 · OK ${okc} · FAIL ${window.__results.length-okc}`;
  setTimeout(()=>next(idx+1), 120);
}
function done(){
  window.__done = true;
  const okc = window.__results.filter(r=>r.ok).length;
  document.getElementById('sum').textContent = `완료 — ${ITEMS.length}개 중 OK ${okc} · FAIL ${ITEMS.length-okc}`;
}
loadApi();
</script>
</body></html>
